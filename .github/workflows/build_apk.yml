name: Build Smart Workshop Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: استخراج وبناء ملف تطبيق الأندرويد (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Gradle Wrapper & Platform Files
        run: |
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          cp -r lib /tmp/lib_backup
          # حفظ وتأمين أيقونات شركة حافظ المخصصة
          mkdir -p /tmp/custom_icons
          for d in android/app/src/main/res/mipmap-*; do
            [ -d "" ] || continue
            bname=""; bname=
            mkdir -p "/tmp/custom_icons/"
            cp ""/* "/tmp/custom_icons//" 2>/dev/null || true
          done
          flutter create . --project-name smart_workshop --org com.smartworkshop --platforms android
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          cp -r /tmp/lib_backup/* lib/
          # استعادة أيقونات شركة حافظ وتثبيتها كأيقونة التطبيق الرسمية
          if [ -d /tmp/custom_icons ]; then
            for d in /tmp/custom_icons/*; do
              [ -d "" ] || continue
              bname=""
              mkdir -p "android/app/src/main/res/"
              cp ""/* "android/app/src/main/res//" 2>/dev/null || true
            done
          fi
          if [ -f android_manifest_custom.xml ]; then
            cp android_manifest_custom.xml android/app/src/main/AndroidManifest.xml
          fi
          # رفع compileSdk لكل المكتبات (مكتبة printing كانت مبنية على android-30)
          cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              val forceCompileSdk: Project.() -> Unit = {
                  val ext = extensions.findByName("android")
                  if (ext != null) {
                      val m = ext.javaClass.methods.firstOrNull { it.name == "setCompileSdk" && it.parameterCount == 1 }
                          ?: ext.javaClass.methods.firstOrNull { it.name == "compileSdkVersion" && it.parameterCount == 1 && it.parameterTypes[0] == Int::class.javaPrimitiveType }
                      m?.invoke(ext, 36)
                  }
              }
              if (state.executed) forceCompileSdk() else afterEvaluate { forceCompileSdk() }
          }
          EOF

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK for Easy Download
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Smart_Workshop_Custom_Release.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Workshop-APK
          path: Smart_Workshop_Custom_Release.apk

      - name: Create GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.${{ github.run_number }}
          name: "إصدار تطبيق الورشة الذكية المخصص v4.0.${{ github.run_number }}"
          body: |
            ### نسخة تطبيق الورشة الذكية المخصصة (بدون إعلانات)
            - إضافة قطاعات جديدة بالاسم والصورة وتحديد أجزاء القطاع (حلق، ضلفة، سكينة، إضافات) وعدد القطع في الشباك مع شاشة معاينة فورية.
            - قائمة تسعير خارجية شاملة لأسعار متر القطاعات، أنواع الزجاج الفردي والدبل، السبيسر، والجورجيا.
            - سجل عملاء كامل قابل للتعديل في أي وقت مع إصدار 2 ملف PDF لكل عميل (كشف عرض السعر + كشف الطلبية الشامل وتقسيم الأعواد 600 سم).
          files: Smart_Workshop_Custom_Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
